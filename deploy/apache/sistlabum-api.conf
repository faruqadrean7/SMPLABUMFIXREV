<VirtualHost *:80>
    ServerName api.sistlabum.local

    DocumentRoot /var/www/sistlabum/current/apps/api/public

    <Directory /var/www/sistlabum/current/apps/api/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Jangan layani dotfile
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog /var/www/sistlabum/logs/api-error.log
    CustomLog /var/www/sistlabum/logs/api-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
