<VirtualHost *:80>
    ServerName sistlabum.local

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    # Next.js dev/WS upgrade (aman kalau tidak dipakai)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3002/$1 [P,L]

    ErrorLog /var/www/sistlabum/logs/web-error.log
    CustomLog /var/www/sistlabum/logs/web-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
