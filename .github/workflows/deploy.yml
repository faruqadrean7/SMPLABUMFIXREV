name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: sistlabum
  APP_ROOT: /var/www/sistlabum

jobs:
  # ------------------------------------------------------------------
  # 1. Gerbang: tidak ada deploy kalau test merah.
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistlabum_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, zip, gd, bcmath, redis
          tools: composer
          coverage: none

      - name: Backend — install
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Backend — siapkan env
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Backend — test
        working-directory: apps/api
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sistlabum_testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend — install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Frontend — typecheck & lint
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint

      - name: Frontend — build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.sistlabum.local/api/v1' }}
          NEXT_PUBLIC_APP_NAME: SISTLABUM
          ADMIN_LOGIN_PATH: ${{ vars.ADMIN_LOGIN_PATH || '/admin-masuk' }}
        run: npm run build

  # ------------------------------------------------------------------
  # 2. Deploy: upload ke release baru, swap symlink, rollback bila gagal.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        run: |
          REL="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "REL=$REL" >> "$GITHUB_ENV"
          TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          ssh -i ~/.ssh/deploy_key "$TARGET" "mkdir -p $APP_ROOT/releases/$REL"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude '.next' \
            --exclude 'storage' \
            --exclude '.env' \
            --exclude '.env.*' \
            ./ "$TARGET:$APP_ROOT/releases/$REL/"

      - name: Aktifkan release
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "~/deploy/bin/release.sh $APP_NAME $REL --skip-build"

      - name: Rollback bila gagal
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "~/deploy/bin/rollback.sh $APP_NAME" || true
