name: Deploy to VPS

on:
  push:
    branches: [ develop, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Kunci dekripsi manifest CBT (hanya ciphertext .enc yang ada di repo).
          CBT_MANIFEST_KEY: ${{ secrets.CBT_MANIFEST_KEY }}
          # Set variabel repo CBT_DEMO_SCHEDULE=1 untuk menjadwalkan ujian demo otomatis.
          CBT_DEMO_SCHEDULE: ${{ vars.CBT_DEMO_SCHEDULE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: CBT_MANIFEST_KEY,CBT_DEMO_SCHEDULE
          script: |
            set -e
            echo "Deploying update..."
            cd /home/fafnir/SMPLABUMFIXREV
            git fetch origin develop
            git reset --hard origin/develop

            # Backend Laravel
            cd /home/fafnir/SMPLABUMFIXREV/apps/api
            php /home/fafnir/.local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force

            # CBT: impor paket PAS Matematika dari manifest terenkripsi. Idempoten.
            # Hanya ciphertext (.enc) ada di repo; didekripsi di sini pakai CBT_MANIFEST_KEY.
            if [ -n "$CBT_MANIFEST_KEY" ]; then
              echo "Seeding paket CBT Matematika..."
              mkdir -p storage/app/import
              openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -iter 100000 \
                -in deploy/cbt/mtk-pas-9-genap-2526.json.enc \
                -out storage/app/import/mtk-pas-9-genap-2526.json \
                -pass env:CBT_MANIFEST_KEY
              php artisan cbt:import-package storage/app/import/mtk-pas-9-genap-2526.json
              php artisan cbt:attach-mtk-figures
              if [ "${CBT_DEMO_SCHEDULE:-0}" = "1" ]; then
                php artisan cbt:demo-schedule-exam
              fi
              # Hapus plaintext (berisi kunci jawaban) setelah impor; data sudah di DB.
              rm -f storage/app/import/mtk-pas-9-genap-2526.json
              echo "Seeding CBT selesai."
            else
              echo "CBT_MANIFEST_KEY tidak diset; lewati seeding CBT."
            fi

            php artisan config:cache
            php artisan route:cache

            # Frontend Next.js
            cd /home/fafnir/SMPLABUMFIXREV/apps/web
            npm run build

            # Restart PM2
            pm2 restart sistlabum-api || true
            pm2 restart sistlabum-web || true
            pm2 save
            echo "Deployment finished successfully!"
