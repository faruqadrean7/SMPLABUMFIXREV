<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" font-family="Arial, sans-serif" font-size="13">
  <rect width="280" height="180" fill="#ffffff"/>
  <!-- hemisphere dome (generic, license-free) -->
  <path d="M60 130 A80 80 0 0 1 220 130 Z" fill="#e8eef4" stroke="#333" stroke-width="1.6"/>
  <!-- base ellipse (dashed back half) -->
  <path d="M60 130 A80 22 0 0 0 220 130" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M60 130 A80 22 0 0 1 220 130" fill="none" stroke="#333" stroke-width="1.4"/>
  <!-- diameter -->
  <line x1="60" y1="130" x2="220" y2="130" stroke="#c0392b" stroke-width="1"/>
  <text x="140" y="152" text-anchor="middle" fill="#333">14 m</text>
  <text x="140" y="172" text-anchor="middle" fill="#777" font-size="11">kubah berbentuk setengah bola</text>
</svg>
