<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" font-family="Arial, sans-serif" font-size="14">
  <rect width="440" height="340" fill="#ffffff"/>
  <text x="135" y="24" text-anchor="middle" font-weight="bold" fill="#333">A</text>
  <text x="325" y="24" text-anchor="middle" font-weight="bold" fill="#333">B</text>
  <text x="24" y="100" font-weight="bold" fill="#333">1</text>
  <text x="24" y="250" font-weight="bold" fill="#333">2</text>
  <!-- axes for each cell -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <path d="M60 40 V150 H220"/><path d="M250 40 V150 H410"/>
    <path d="M60 190 V300 H220"/><path d="M250 190 V300 H410"/>
  </g>
  <!-- A1: no correlation (horizontal band) -->
  <g fill="#333"><circle cx="80" cy="100" r="2.6"/><circle cx="100" cy="94" r="2.6"/><circle cx="120" cy="104" r="2.6"/><circle cx="140" cy="97" r="2.6"/><circle cx="165" cy="101" r="2.6"/><circle cx="190" cy="96" r="2.6"/></g>
  <!-- B1: strong positive -->
  <g fill="#333"><circle cx="262" cy="140" r="2.6"/><circle cx="282" cy="126" r="2.6"/><circle cx="302" cy="112" r="2.6"/><circle cx="322" cy="98" r="2.6"/><circle cx="342" cy="84" r="2.6"/><circle cx="362" cy="70" r="2.6"/><circle cx="382" cy="58" r="2.6"/></g>
  <!-- A2: weak negative (loose descending) -->
  <g fill="#333"><circle cx="80" cy="205" r="2.6"/><circle cx="104" cy="222" r="2.6"/><circle cx="126" cy="214" r="2.6"/><circle cx="150" cy="242" r="2.6"/><circle cx="172" cy="252" r="2.6"/><circle cx="196" cy="236" r="2.6"/></g>
  <!-- B2: scattered -->
  <g fill="#333"><circle cx="262" cy="206" r="2.6"/><circle cx="292" cy="252" r="2.6"/><circle cx="322" cy="212" r="2.6"/><circle cx="352" cy="256" r="2.6"/><circle cx="382" cy="224" r="2.6"/></g>
</svg>
