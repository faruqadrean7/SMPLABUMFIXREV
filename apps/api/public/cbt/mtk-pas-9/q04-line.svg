<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Arial, sans-serif" font-size="13">
  <rect width="360" height="320" fill="#ffffff"/>
  <!-- grid -->
  <g stroke="#e3e6ea" stroke-width="1">
    <line x1="24" y1="40" x2="336" y2="40"/><line x1="24" y1="70" x2="336" y2="70"/>
    <line x1="24" y1="100" x2="336" y2="100"/><line x1="24" y1="130" x2="336" y2="130"/>
    <line x1="24" y1="160" x2="336" y2="160"/><line x1="24" y1="190" x2="336" y2="190"/>
    <line x1="24" y1="220" x2="336" y2="220"/><line x1="24" y1="280" x2="336" y2="280"/>
    <line x1="60" y1="20" x2="60" y2="300"/><line x1="96" y1="20" x2="96" y2="300"/>
    <line x1="132" y1="20" x2="132" y2="300"/><line x1="168" y1="20" x2="168" y2="300"/>
    <line x1="204" y1="20" x2="204" y2="300"/><line x1="240" y1="20" x2="240" y2="300"/>
    <line x1="276" y1="20" x2="276" y2="300"/><line x1="312" y1="20" x2="312" y2="300"/>
  </g>
  <!-- axes (x=0 at px=60, y=0 at py=250; unit x=36px, unit y=30px) -->
  <g stroke="#333" stroke-width="1.6">
    <line x1="24" y1="250" x2="336" y2="250"/>
    <line x1="60" y1="20" x2="60" y2="300"/>
    <polygon points="336,250 328,246 328,254" fill="#333"/>
    <polygon points="60,20 56,28 64,28" fill="#333"/>
  </g>
  <!-- line through (0,6)->(3,0): y = -2x + 6  i.e. 6x+3y=18 -->
  <line x1="42" y1="52" x2="186" y2="304" stroke="#c0392b" stroke-width="2.4"/>
  <!-- intercept dots -->
  <circle cx="60" cy="70" r="3.2" fill="#c0392b"/><circle cx="168" cy="250" r="3.2" fill="#c0392b"/>
  <!-- labels -->
  <text x="320" y="268" fill="#333">x</text>
  <text x="44" y="30" fill="#333">y</text>
  <text x="40" y="74" fill="#333">6</text>
  <text x="164" y="268" fill="#333">3</text>
  <text x="48" y="264" fill="#333">0</text>
</svg>
