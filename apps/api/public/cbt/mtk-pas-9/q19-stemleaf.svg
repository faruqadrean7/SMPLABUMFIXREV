<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" font-family="Arial, sans-serif" font-size="14">
  <rect width="420" height="200" fill="#ffffff"/>
  <text x="120" y="28" text-anchor="middle" font-weight="bold" fill="#333">Question 1</text>
  <text x="300" y="28" text-anchor="middle" font-weight="bold" fill="#333">Question 2</text>
  <!-- central stem column -->
  <line x1="200" y1="40" x2="200" y2="170" stroke="#333" stroke-width="1.4"/>
  <line x1="222" y1="40" x2="222" y2="170" stroke="#333" stroke-width="1.4"/>
  <g text-anchor="middle" fill="#333">
    <text x="211" y="66">3</text><text x="211" y="98">4</text><text x="211" y="130">5</text>
  </g>
  <!-- Question 1 leaves (read right-to-left) -->
  <g text-anchor="end" fill="#333" letter-spacing="4">
    <text x="196" y="66">4 3</text>
    <text x="196" y="98">7 6 1 1</text>
    <text x="196" y="130">1 0</text>
  </g>
  <!-- Question 2 leaves -->
  <g fill="#333" letter-spacing="4">
    <text x="228" y="66">6 6</text>
    <text x="228" y="98">1 3</text>
    <text x="228" y="130">0 2 9</text>
  </g>
  <text x="210" y="192" text-anchor="middle" fill="#777" font-size="11">Key: 3 | 6 = 36</text>
</svg>
