<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Arial, sans-serif" font-size="13">
  <rect width="320" height="200" fill="#ffffff"/>
  <!-- pentagonal cross-section (front, shaded) -->
  <polygon points="60,150 50,110 90,80 130,110 120,150" fill="#dfe7ee" stroke="#333" stroke-width="1.5"/>
  <!-- depth edges -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <line x1="60" y1="150" x2="170" y2="150"/>
    <line x1="50" y1="110" x2="160" y2="110"/>
    <line x1="90" y1="80" x2="200" y2="80"/>
    <line x1="130" y1="110" x2="240" y2="110"/>
    <line x1="120" y1="150" x2="230" y2="150"/>
  </g>
  <!-- back pentagon (partial) -->
  <polygon points="170,150 160,110 200,80 240,110 230,150" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="88" y="124" text-anchor="middle" fill="#333">Area =</text>
  <text x="88" y="140" text-anchor="middle" fill="#333">10 cm²</text>
  <text x="178" y="172" fill="#333">4 cm</text>
  <line x1="120" y1="165" x2="230" y2="165" stroke="#777" stroke-width="0.8"/>
</svg>
