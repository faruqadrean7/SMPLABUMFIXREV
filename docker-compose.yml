# ============================================================================
# Shared anchors — dipakai ulang oleh api / worker / scheduler (DRY)
# ============================================================================
x-api-build: &api-build
  context: ./apps/api
  dockerfile: Dockerfile

x-api-environment: &api-environment
  PHP_CLI_SERVER_WORKERS: "35"
  TEST_DISABLE_RATE_LIMIT: ${TEST_DISABLE_RATE_LIMIT:-true}
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:-base64:w6oCVlMI64nU2Pmfg4Zp4LzcQXDC+lPJsZ63sL4wwTQ=}
  APP_URL: http://localhost:8000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-sistlabum}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  # Default "local" agar `docker compose up` polos tetap jalan tanpa MinIO.
  # Set FILESYSTEM_DISK=s3 di .env + jalankan profil storage untuk pakai MinIO.
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${S3_BUCKET:-sistlabum-files}
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  UAT_SEED_ENABLED: ${UAT_SEED_ENABLED:-true}
  # DEV ONLY: lewati 2FA login admin (diabaikan bila APP_ENV=production).
  ADMIN_2FA_BYPASS: ${ADMIN_2FA_BYPASS:-false}

services:
  # ============================================================================
  # PostgreSQL Database (v16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sistlabum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-sistlabum}
    ports:
      - "${DB_PORT_HOST:-${DB_PORT:-5433}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-sistlabum}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sistlabum-network

  # ============================================================================
  # Redis Cache & Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: sistlabum-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sistlabum-network

  # ============================================================================
  # MinIO S3-Compatible Object Storage (Jalankan dengan: docker compose --profile storage up)
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["storage"]
    container_name: sistlabum-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sistlabum-network

  # ============================================================================
  # Mailpit (Local SMTP Server & Web Webmail Inspector)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: sistlabum-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - sistlabum-network

  # ============================================================================
  # Backend API (Laravel / PHP-FPM / Artisan Server)
  # Startup: composer install -> migrate (idempoten) -> serve.
  # Seeding TIDAK otomatis (seeder di-guard opt-in & bisa duplikat); jalankan
  # sekali manual: docker compose exec api php artisan migrate --seed
  # ============================================================================
  api:
    build: *api-build
    container_name: sistlabum-api
    command: >
      sh -c "composer install --no-interaction --no-progress --prefer-dist &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment: *api-environment
    volumes:
      - ./apps/api:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - sistlabum-network

  # ============================================================================
  # Queue Worker (Laravel queue:work) — memproses job antrean Redis
  # ============================================================================
  worker:
    build: *api-build
    container_name: sistlabum-worker
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3 --max-jobs=1000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - ./apps/api:/var/www/html
    networks:
      - sistlabum-network

  # ============================================================================
  # Scheduler (Laravel schedule:work) — menjalankan task terjadwal
  # ============================================================================
  scheduler:
    build: *api-build
    container_name: sistlabum-scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment: *api-environment
    volumes:
      - ./apps/api:/var/www/html
    networks:
      - sistlabum-network

  # ============================================================================
  # Frontend Web (Next.js 14 - Landing, PPDB, Admin, Portal Terpadu)
  # ============================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sistlabum-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: "SISTLABUM - Portal Sekolah Satu Pintu"
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - sistlabum-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  sistlabum-network:
    driver: bridge
